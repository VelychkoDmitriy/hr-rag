name: eval

on:
  push:
    branches: [main]
  pull_request:

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # replay the committed caches: retrieval (embeddings, query vectors, rerank scores) and LLM answers/judges.
      # A change to a prompt, a chunk or a question misses the cache and fails the job: re-run the eval locally
      # with a key (python main.py eval) and commit evals/cache/ together with the change.
      HR_RAG_OFFLINE: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: retrieval metrics
        run: python main.py eval-retrieval
      - name: end-to-end eval with thresholds
        run: python main.py eval --check
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: eval-results
          path: evals/results/

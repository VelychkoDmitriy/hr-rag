# Document registry of the corpus.
#   real documents   -> downloaded by scripts/fetch_corpus.py (groups laws, ilo, guidance)
#   manual documents -> downloaded by hand into data/manual/ (Cloudflare blocks scripts), not committed
#   company          -> generated by scripts/make_company_docs.py (fictional company, deliberate traps)
#
# fields:
#   id, title, lang (uk|en), doc_type (law|ilo|guidance|company_policy|company_data)
#   version        edition date, "current" (as of the download date) or a company version
#   version_group  documents that are versions / translations of the same text
#   is_current     false for outdated editions: kept in the index as a trap, marked in metadata
# Official documents (laws, conventions) are not protected by copyright in Ukraine (Law on Copyright, art. 10).

